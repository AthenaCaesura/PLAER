name = "plaer"
version = "0.1.0"
defaultTargets = ["Plaer"]

[[require]]
name = "LeanTeX"
path = "vendor/LeanTeX"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.35.0"

[[lean_lib]]
name = "Plaer"

[[lean_lib]]
name = "ExampleStatements"
srcDir = "examples"
roots = ["Fermat.Statements", "Basics.Statements"]

[[lean_lib]]
name = "ExampleDocuments"
srcDir = "examples"
roots = ["Fermat.Paper", "Basics.Paper"]

[[lean_lib]]
name = "TestFixtures"
srcDir = "tests"
roots = ["fixtures.Interval"]
