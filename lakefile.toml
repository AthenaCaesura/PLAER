name = "plaer"
version = "0.1.0"
defaultTargets = ["Paper"]

[[require]]
name = "LeanTeX"
path = "vendor/LeanTeX"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.35.0"

[[lean_lib]]
name = "Plaer"

[[lean_lib]]
name = "Paper"

[[lean_exe]]
name = "generate-paper"
root = "Main"
supportInterpreter = true
