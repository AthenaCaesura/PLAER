name = "plaer"
version = "0.1.0"
defaultTargets = ["Plaer"]

[[require]]
name = "LeanTeX"
path = "vendor/LeanTeX"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "Plaer"

# One entry per folder under examples/. A folder's Paper.md generates its
# Statements.lean, and its proof files import `<Folder>.Statements`.
# To add a project, add its folder name to both lists.
[[lean_lib]]
name = "Examples"
srcDir = "examples"
roots = ["Basics", "Fermat"]
globs = ["Basics.+", "Fermat.+"]

# `SelfTest` is a throwaway paper that tests/python/test_document.py creates.
[[lean_lib]]
name = "TestFixtures"
srcDir = "tests"
roots = ["fixtures.Interval", "SelfTest"]
globs = ["fixtures.Interval", "SelfTest.+"]
